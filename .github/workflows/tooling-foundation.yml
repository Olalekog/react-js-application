name: Tooling Foundation

on:
  push:
    branches:
      - dev
      - uat
      - production
    paths:
      - "terraform/tooling/**"
      - ".github/workflows/tooling-foundation.yml"

  pull_request:
    branches:
      - uat
      - production
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review

  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

permissions:
  id-token: write
  contents: read
  pull-requests: read

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: react-js-application
  TOOLING_ACCOUNT_ID: "866934333672"
  GITREPO_ORG: ${{ vars.GITREPO_ORG }}
  GIT_REPO: ${{ vars.GIT_REPO }}
  TERRAFORM_VERSION: "1.9.0"

jobs:
  validate-promotion-path:
    name: Validate PR Promotion Path
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Validate source and target branch
        shell: bash
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"
          TARGET_BRANCH="${{ github.base_ref }}"

          echo "Source branch: ${SOURCE_BRANCH}"
          echo "Target branch: ${TARGET_BRANCH}"

          if [[ "${TARGET_BRANCH}" == "uat" && "${SOURCE_BRANCH}" == "dev" ]]; then
            echo "Valid promotion path: dev -> uat"
            exit 0
          fi

          if [[ "${TARGET_BRANCH}" == "production" && "${SOURCE_BRANCH}" == "uat" ]]; then
            echo "Valid promotion path: uat -> production"
            exit 0
          fi

          echo "Invalid promotion path."
          echo "Allowed promotion paths are:"
          echo "  dev -> uat"
          echo "  uat -> production"
          exit 1

  tooling-foundation:
    name: Tooling Foundation
    runs-on: ubuntu-latest
    needs:
      - validate-promotion-path
    if: |
      always() &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.validate-promotion-path.result == 'success'
      )

    defaults:
      run:
        working-directory: terraform/tooling

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Terraform action
        id: resolve-action
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TERRAFORM_ACTION="${{ github.event.inputs.action }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TERRAFORM_ACTION="plan"
          else
            TERRAFORM_ACTION="plan"
          fi
          echo "terraform_action=${TERRAFORM_ACTION}" >> "$GITHUB_OUTPUT"
          echo "Terraform action: ${TERRAFORM_ACTION}"

      - name: Configure AWS credentials for first tooling run
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.TOOLING_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TOOLING_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Import existing tooling resources if needed
        shell: bash
        run: |
          terraform import aws_kms_alias.state alias/react-js-application-tooling-state-kms || true

          terraform import aws_s3_bucket.state react-js-application-terraform-state-866934333672 || true

          terraform import aws_dynamodb_table.locks react-js-application-terraform-locks || true

          terraform import aws_iam_openid_connect_provider.github-oidc-connection \
            arn:aws:iam::866934333672:oidc-provider/token.actions.githubusercontent.com || true  

      - name: Terraform Plan
        if: steps.resolve-action.outputs.terraform_action == 'plan'
        run: |
          terraform plan \
            -var="aws_region=${AWS_REGION}" \
            -var="project_name=${PROJECT_NAME}" \
            -var="tooling_account_id=${TOOLING_ACCOUNT_ID}" \
            -var="github_org=${GITREPO_ORG}" \
            -var="github_repo=${GIT_REPO}" \
            -out=tfplan

      - name: Terraform Apply
        if: steps.resolve-action.outputs.terraform_action == 'apply'
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${AWS_REGION}" \
            -var="project_name=${PROJECT_NAME}" \
            -var="tooling_account_id=${TOOLING_ACCOUNT_ID}" \
            -var="github_org=${GITREPO_ORG}" \
            -var="github_repo=${GIT_REPO}"

      - name: Terraform Destroy
        if: steps.resolve-action.outputs.terraform_action == 'destroy'
        run: |
          terraform destroy -auto-approve \
            -var="aws_region=${AWS_REGION}" \
            -var="project_name=${PROJECT_NAME}" \
            -var="tooling_account_id=${TOOLING_ACCOUNT_ID}" \
            -var="github_org=${GITREPO_ORG}" \
            -var="github_repo=${GIT_REPO}"

      - name: Show Terraform Outputs
        if: steps.resolve-action.outputs.terraform_action == 'apply'
        run: terraform output
